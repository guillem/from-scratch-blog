[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Role-based redirects are a coarse CDN perimeter only.
# Every admin write is also authorized server-side.
[[redirects]]
  from = "/admin"
  to = "/admin"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/login"
  status = 302
  force = true

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 4321
  framework = "#custom"
